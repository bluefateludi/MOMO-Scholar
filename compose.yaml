name: momo-techscout

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: momo-techscout-web:local
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - techscout-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

volumes:
  techscout-data:
