[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent"
version = "0.1.0"
description = "MOMO TechScout: evidence-grounded research and verification for Python AI component selection"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["ai-agent", "component-selection", "research", "rag", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "typer>=0.12",
  "pydantic>=2",
  "httpx>=0.27",
  "mcp>=2,<3",
  "python-dotenv>=1.0",
  "rich>=13",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pymupdf>=1.24,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.12,<1",
  "setuptools>=61",
  "tomli>=2; python_version < '3.11'",
]
observability = [
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
]
[project.scripts]
paper-agent = "paper_agent.cli:app"
techscout = "paper_agent.techscout.cli:app"

[project.urls]
Homepage = "https://github.com/bluefateludi/MOMO-TechScout"
Documentation = "https://github.com/bluefateludi/MOMO-TechScout/tree/master/docs/techscout"
Issues = "https://github.com/bluefateludi/MOMO-TechScout/issues"
Security = "https://github.com/bluefateludi/MOMO-TechScout/security/policy"

[tool.setuptools.packages.find]
include = ["paper_agent", "paper_agent.*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
"paper_agent.web" = ["demo_data/synthetic-demo-v1/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Ruff treats this valid dynamic annotation lookup as an F821 forward reference.
"paper_agent/pipeline.py" = ["F821"]
