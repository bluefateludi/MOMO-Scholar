name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e ".[dev]"

      - name: Ruff correctness checks
        run: python -m ruff check .

      - name: Offline Python tests
        run: python -m pytest

      - name: Build wheel without dependency resolution
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .

      - name: Smoke-test installed CLI from wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          paper-agent --help

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python for OpenAPI snapshot
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python application dependencies
        working-directory: .
        run: python -m pip install --disable-pip-version-check --no-input .

      - name: Install locked Web dependencies
        run: npm ci --ignore-scripts

      - name: Check OpenAPI contract snapshot
        run: npm run contracts:check

      - name: Run offline Web tests
        run: npm test

      - name: Type-check and build Web application
        run: npm run build

  # Deferred until the corresponding implementation slices exist:
  # - three deterministic Agent vertical smokes backed only by frozen fakes
  # - Docker sandbox build and explicit no-network smoke
  # Empty placeholder jobs would make these future gates appear to pass.
